name: govulncheck

# Scans Go dependencies for known vulnerabilities. Runs on PRs that touch Go code and
# weekly to catch newly disclosed CVEs out of band. This is kan's Go vuln story in
# place of Dependabot (which is disabled in repo settings).

on:
  schedule:
    - cron: '0 10 * * 1'  # Weekly, Monday ~10:00 UTC
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          # Scan with latest stable Go rather than go.mod's floor - there's no single
          # toolchain our releases are built with (Homebrew uses the tap's Go, `go
          # install` uses the user's), so stable is the proxy that catches the most.
          # Don't switch this to go-version-file: the action always forwards
          # go-version-input to setup-go as go-version, which silently wins.
          go-version-input: stable
